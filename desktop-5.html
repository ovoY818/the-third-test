<script>
  // 获取所有包含音频的图标
  const icons = document.querySelectorAll('.exclude-82, .exclude-83, .exclude-84, .exclude-85, .exclude-86, .exclude-87');

  // 当前正在播放的音频元素
  let currentAudio = null;

  // 给每个图标绑定点击事件
  icons.forEach(icon => {
    icon.addEventListener('click', function () {
      // 获取当前图标对应的音频文件名
      const audioSrc = this.dataset.audio;

      // 查询页面中是否已经存在对应的 <audio> 元素
      let audio = document.querySelector(`audio[data-src="${audioSrc}"]`);

      // 如果该音频元素还不存在，则创建一个
      if (!audio) {
        audio = document.createElement('audio');
        audio.setAttribute('data-src', audioSrc);
        audio.preload = 'metadata';

        // 创建一个隐藏的 Audio 对象，用于获取文件信息
        const hiddenAudio = new Audio();
        hiddenAudio.src = audioSrc;
        hiddenAudio.preload = 'metadata';

        // 当音频元数据加载完成后，将其加入页面
        hiddenAudio.addEventListener('loadedmetadata', function () {
          if (!document.querySelector(`audio[data-src="${audioSrc}"]`)) {
            audio.src = hiddenAudio.src;
            document.body.appendChild(audio);
          }
        });

        // 确保音频文件能正确加载
        hiddenAudio.addEventListener('error', function () {
          console.error('无法加载音频文件:', audioSrc);
        });
      }

      // 如果当前点击的是当前正在播放的图标，则切换播放/暂停
      if (currentAudio === audio) {
        if (audio.paused) {
          audio.play().catch(error => {
            console.error('播放失败:', error);
          });
        } else {
          audio.pause();
        }
      } else {
        // 切换到其他图标时，先暂停上一个正在播放的音频
        if (currentAudio) {
          currentAudio.pause();
          currentAudio = null;
        }

        // 播放当前图标对应的音频
        audio.play().then(() => {
          currentAudio = audio;
        }).catch(error => {
          console.error('播放失败:', error);
        });
      }
    });
  });
</script>
